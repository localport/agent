version: 1

# Forward ports from several devices. Each entry opens one mTLS connection.
#
# `forward` takes -L values in OpenSSH order.
#   "5020:502"  listen on 5020, reach the device's port 502
#   "502"       reach 502 on a local port the system picks
access:
  - device: plc-01-factory.ap.localport.dev
    # Stored credential from `localport setup <TOKEN>` or `localport login`.
    # Omit when only one is stored.
    identity: deploy-prod
    forward: ["5020:502", "8080:80"]

  - device: gw-01-factory.ap.localport.dev
    # A credential issued elsewhere is read from a file.
    bundle: ./gw-01.pem
    forward: ["2222:22"]
