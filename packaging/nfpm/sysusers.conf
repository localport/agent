# The system user and group "localport" that the fleet device agent runs as.
# The package installs this file at /usr/lib/sysusers.d/localport.conf.
# Package removal and `localport service uninstall --purge` keep the account.
# postinstall.sh creates the same account where systemd-sysusers is missing.
u localport - "Localport agent" /nonexistent -
