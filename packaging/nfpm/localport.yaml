# localport package (deb, rpm, Alpine apk). The OpenWrt package is built with
# the OpenWrt SDK from packaging/openwrt/.
# Variables are set by scripts/release/packages.sh. SESSION_BINARY is the
# localport-session build the target needs: glibc with PAM for deb and rpm, musl
# without PAM for apk (localport-pam.yaml replaces it with the musl PAM build).
# Service units are not packaged: `localport connect` and
# `localport service install` write them.

name: localport
arch: ${NFPM_ARCH}
platform: linux
version: ${PKG_VERSION}
release: 1
section: net
priority: optional
maintainer: Localport <support@localport.io>
vendor: Localport
homepage: https://localport.io
license: Apache-2.0
description: |-
  Localport agent: secure tunnels and remote access
  Publishes services over secure HTTP, TCP and TLS tunnels, and gives
  identity-based remote access to devices in a Localport fleet.

contents:
  - src: ${BINARY}
    dst: /usr/bin/localport
    expand: true
    file_info:
      mode: 0755
  - src: ${SESSION_BINARY}
    dst: /usr/bin/localport-session
    expand: true
    file_info:
      mode: 0755

  - src: packaging/pam/localport.debian
    dst: /etc/pam.d/localport
    type: config|noreplace
    packager: deb
    file_info:
      mode: 0644
  - src: packaging/pam/localport.redhat
    dst: /etc/pam.d/localport
    type: config|noreplace
    packager: rpm
    file_info:
      mode: 0644

  - src: packaging/deb/copyright
    dst: /usr/share/doc/localport/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/doc/localport/NOTICE
    packager: deb
    file_info:
      mode: 0644
  - src: THIRD_PARTY_NOTICES
    dst: /usr/share/doc/localport/THIRD_PARTY_NOTICES
    packager: deb
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/licenses/localport/LICENSE
    packager: rpm
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/licenses/localport/NOTICE
    packager: rpm
    file_info:
      mode: 0644
  - src: THIRD_PARTY_NOTICES
    dst: /usr/share/licenses/localport/THIRD_PARTY_NOTICES
    packager: rpm
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/licenses/localport/LICENSE
    packager: apk
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/licenses/localport/NOTICE
    packager: apk
    file_info:
      mode: 0644
  - src: THIRD_PARTY_NOTICES
    dst: /usr/share/licenses/localport/THIRD_PARTY_NOTICES
    packager: apk
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/nfpm/postinstall.sh

overrides:
  rpm:
    recommends:
      - localport-selinux

rpm:
  summary: Localport agent for secure tunnels and remote access
  packager: Localport <support@localport.io>
  compression: zstd
  signature:
    key_file: ${RPM_KEY_FILE}

deb:
  compression: xz

# nfpm does not expand variables in key_name. packages.sh fills it in.
apk:
  signature:
    key_file: ${APK_KEY_FILE}
    key_name: "@APK_KEY_NAME@"
