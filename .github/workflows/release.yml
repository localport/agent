name: Release

# A v* tag builds a draft release. After `make release-sign`, the approved
# publish job signs the packages and publishes. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  IMAGE: ghcr.io/localport/agent

jobs:
  tag:
    name: Check tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check tag
        id: tag
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi

  # The cgo localport-session builds and the signed darwin binaries; the
  # build job ships them with the rest of the release set.
  sessions:
    uses: ./.github/workflows/session.yml
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}
      cache: false

  # OpenWrt packages, built with the OpenWrt SDK of each package arch. The
  # build job ships them in the release set; publish indexes the feed.
  # OpenWrt versions are X.Y.Z only (sdk.sh), so a prerelease skips the steps.
  # The job itself still runs: a skipped job would skip every job after it.
  openwrt:
    name: OpenWrt (${{ matrix.arch }})
    needs: tag
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - arm_arm1176jzf-s_vfp
          - mipsel_24kc
          - mips_24kc
          - riscv64_generic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.tag.outputs.prerelease == 'false'
        with:
          persist-credentials: false

      - name: Build
        if: needs.tag.outputs.prerelease == 'false'
        env:
          ARCH: ${{ matrix.arch }}
        run: packaging/openwrt/sdk.sh build "$ARCH" "${TAG#v}" out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.tag.outputs.prerelease == 'false'
        with:
          name: openwrt-${{ matrix.arch }}
          path: out/localport-openwrt-*.apk
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build draft
    needs: [tag, sessions, openwrt]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      prerelease: ${{ needs.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches in release builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go install github.com/google/go-licenses/v2@v2.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{session-*,darwin}"
          path: bin
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.tag.outputs.prerelease == 'false'
        with:
          pattern: openwrt-*
          path: openwrt
          merge-multiple: true

      # Artifacts do not keep file modes.
      - run: chmod 0755 bin/localport-*

      - name: Build
        run: |
          make dist \
            VERSION="$TAG" \
            BUILDVCS=true \
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"

      - name: OpenWrt packages
        if: needs.tag.outputs.prerelease == 'false'
        run: cp openwrt/localport-openwrt-*.apk dist/

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/localport.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The Windows executables leave dist: the packaging job signs them and
      # returns the signed copies with the installer and the zip.
      - name: Windows stage
        run: |
          mkdir windows-stage
          mv dist/localport-windows-amd64.exe windows-stage/localport.exe
          mv dist/localport-session-windows-amd64.exe windows-stage/localport-session.exe
          cp LICENSE NOTICE THIRD_PARTY_NOTICES windows-stage/
          rm -f dist/checksums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-stage
          path: windows-stage/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Windows installer and zip, built from signed executables. With the repo
  # variable SIGNPATH_PROJECT_SLUG set, SignPath Foundation signs in two
  # submissions (each needs an approval in SignPath): the executables and the
  # uninstaller, then the installer that embeds them. Without it the same
  # files are built unsigned, in the same order.
  package-windows:
    name: Windows packages
    needs: build
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # SignPath reads the uploaded artifacts
    env:
      NSIS_VERSION: "3.13"
      # SHA-256 of the official download; SourceForge publishes no checksum.
      NSIS_ZIP_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
      SIGNPATH: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-stage
          path: stage

      - name: Install NSIS
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/nsis.zip" \
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/$NSIS_VERSION/nsis-$NSIS_VERSION.zip"
          echo "$NSIS_ZIP_SHA256  $RUNNER_TEMP/nsis.zip" | sha256sum --check --strict -
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath \"$RUNNER_TEMP/nsis.zip\" -DestinationPath \"$RUNNER_TEMP/nsis\""
          echo "MAKENSIS=$RUNNER_TEMP/nsis/nsis-$NSIS_VERSION/makensis.exe" >>"$GITHUB_ENV"

      - name: Uninstaller
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/release/windows-package.sh uninstaller stage

      - name: Upload executables for signing
        id: unsigned
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-binaries
          path: |
            stage/localport.exe
            stage/localport-session.exe
            stage/uninstall.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign executables (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: stage

      - name: Installer and zip
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            scripts/release/windows-package.sh installer stage out

      - name: Upload installer for signing
        id: installer
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-installer
          path: out/localport-setup-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out

      - name: Check signatures
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem out\*.exe) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name): Authenticode status $($s.Status)" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packaged
          path: out/
          if-no-files-found: error
          retention-days: 1

  # Checksums, provenance and the Sigstore signature cover the final files,
  # the signed and packaged Windows ones included.
  draft:
    name: Draft release
    needs: [build, package-windows]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore signing and build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-packaged
          path: dist

      - name: Checksums
        run: scripts/release/checksums.sh dist

      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign checksums (Sigstore)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*

  publish:
    name: Publish
    needs: [build, draft]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: release
      url: https://github.com/localport/agent/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # publish the release
      packages: write # push the image
      id-token: write # Sigstore signing and build provenance
      attestations: write
    env:
      STABLE: ${{ needs.build.outputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir dist

      # Nothing below runs without the maintainer's signature.
      - name: Verify release signature
        run: scripts/release/verify.sh dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.STABLE == 'true'
        with:
          go-version-file: go.mod
          cache: false

      - name: Install nfpm
        if: env.STABLE == 'true'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0

      - name: Load signing keys
        if: env.STABLE == 'true'
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          OPENWRT_PRIVATE_KEY: ${{ secrets.OPENWRT_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$REPO_GPG_PRIVATE_KEY" >"$RUNNER_TEMP/keys/repo.asc"
          printf '%s\n' "$APK_PRIVATE_KEY" >"$RUNNER_TEMP/keys/apk.rsa"
          printf '%s\n' "$OPENWRT_PRIVATE_KEY" >"$RUNNER_TEMP/keys/openwrt.pem"

      - name: Packages
        if: env.STABLE == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          RPM_KEY_FILE="$RUNNER_TEMP/keys/repo.asc" \
          APK_KEY_FILE="$RUNNER_TEMP/keys/apk.rsa" \
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            make packages

      - name: Fetch published repository
        if: env.STABLE == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: scripts/release/r2.sh pull dist/repo

      - name: Repository indexes
        if: env.STABLE == 'true'
        env:
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
          # One SDK download serves every arch's index.
          SDK_DIR: ${{ runner.temp }}/openwrt-sdk
        run: |
          cp release/keys/localport-archive-keyring.gpg release/keys/RPM-GPG-KEY-localport release/keys/*.rsa.pub dist/repo/
          make repo REPO_GPG_KEY_FILE="$RUNNER_TEMP/keys/repo.asc"
          make repo-apk APK_KEY_FILE="$RUNNER_TEMP/keys/apk.rsa"
          # OpenWrt feed: openwrt/<release series>/<package arch>/, named as
          # apk fetches it (name-version), with a signed packages.adb per arch.
          series="$(packaging/openwrt/sdk.sh series)"
          for f in dist/localport-openwrt-*.apk; do
            arch="${f#dist/localport-openwrt-}"; arch="${arch%.apk}"
            dir="dist/repo/openwrt/$series/$arch"
            mkdir -p "$dir"
            cp "$f" "$dir/localport-${TAG#v}-r1.apk"
            packaging/openwrt/sdk.sh index "$dir" "$RUNNER_TEMP/keys/openwrt.pem"
          done
          cp release/keys/localport-openwrt.pem dist/repo/openwrt/

      - name: Install test
        if: env.STABLE == 'true'
        run: scripts/release/repo-test.sh dist/repo

      - name: Publish repository
        if: env.STABLE == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: scripts/release/r2.sh push dist/repo

      - name: Remove signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=docker.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: image
        run: |
          {
            echo "created=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "$IMAGE:${TAG#v}"
            if [ "$STABLE" = true ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.image.outputs.created }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign image (Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft=false)
          if [ "$STABLE" = true ]; then flags+=(--latest); fi
          gh release edit "$TAG" "${flags[@]}"

      - name: Package manager token
        id: app
        if: env.STABLE == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: localport
          repositories: homebrew-tap,scoop-bucket

      - name: Homebrew and Scoop
        if: env.STABLE == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: scripts/release/manifests.sh dist

  # Needs the package in winget-pkgs. The first submission is manual.
  winget:
    name: winget
    needs: [build, publish]
    if: needs.build.outputs.prerelease == 'false' && vars.WINGET_IDENTIFIER != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: winget
    permissions: {}
    env:
      KOMAC_VERSION: 2.17.2
      KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
    steps:
      - name: Install Komac
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/komac.tar.gz" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/komac.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac

      - name: Submit
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          IDENTIFIER: ${{ vars.WINGET_IDENTIFIER }}
        run: |
          base="https://github.com/localport/agent/releases"
          # The machine installer and the command-line zip, as the first
          # submission's manifest (packaging/windows/winget) lists them.
          "$RUNNER_TEMP/komac" update "$IDENTIFIER" \
            --version "${TAG#v}" \
            --urls "$base/download/$TAG/localport-setup-${TAG#v}-windows-amd64.exe" "$base/download/$TAG/localport-windows-amd64.zip" \
            --release-notes-url "$base/tag/$TAG" \
            --submit
