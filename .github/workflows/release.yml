name: Release

# A v* tag builds a draft release. After `make release-sign`, the approved
# publish job signs the packages and publishes. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  IMAGE: ghcr.io/localport/agent

jobs:
  build:
    name: Build draft
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore signing and build provenance
      attestations: write
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check tag
        id: tag
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches in release builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Build
        run: |
          make dist \
            VERSION="$TAG" \
            BUILDVCS=true \
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"

      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/localport.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: scripts/release/checksums.sh dist

      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign checksums (Sigstore)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: release
      url: https://github.com/localport/agent/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # publish the release
      packages: write # push the image
      id-token: write # Sigstore signing and build provenance
      attestations: write
    env:
      STABLE: ${{ needs.build.outputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir dist

      # Nothing below runs without the maintainer's signature.
      - name: Verify release signature
        run: scripts/release/verify.sh dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.STABLE == 'true'
        with:
          go-version-file: go.mod
          cache: false

      - name: Install nfpm
        if: env.STABLE == 'true'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Load signing keys
        if: env.STABLE == 'true'
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$REPO_GPG_PRIVATE_KEY" >"$RUNNER_TEMP/keys/repo.asc"
          printf '%s\n' "$APK_PRIVATE_KEY" >"$RUNNER_TEMP/keys/apk.rsa"

      - name: Packages
        if: env.STABLE == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          RPM_KEY_FILE="$RUNNER_TEMP/keys/repo.asc" \
          APK_KEY_FILE="$RUNNER_TEMP/keys/apk.rsa" \
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            make packages

      - name: Fetch published repository
        if: env.STABLE == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: scripts/release/r2.sh pull dist/repo

      - name: Repository indexes
        if: env.STABLE == 'true'
        env:
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          cp release/keys/localport-archive-keyring.gpg release/keys/RPM-GPG-KEY-localport release/keys/*.rsa.pub dist/repo/
          make repo REPO_GPG_KEY_FILE="$RUNNER_TEMP/keys/repo.asc"
          make repo-apk APK_KEY_FILE="$RUNNER_TEMP/keys/apk.rsa"

      - name: Install test
        if: env.STABLE == 'true'
        run: scripts/release/repo-test.sh dist/repo

      - name: Publish repository
        if: env.STABLE == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: scripts/release/r2.sh push dist/repo

      - name: Remove signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: image
        run: |
          {
            echo "created=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "$IMAGE:${TAG#v}"
            if [ "$STABLE" = true ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.image.outputs.created }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image (Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft=false)
          if [ "$STABLE" = true ]; then flags+=(--latest); fi
          gh release edit "$TAG" "${flags[@]}"

      - name: Package manager token
        id: app
        if: env.STABLE == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: localport
          repositories: homebrew-tap,scoop-bucket

      - name: Homebrew and Scoop
        if: env.STABLE == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: scripts/release/manifests.sh dist

  # Needs the package in winget-pkgs. The first submission is manual.
  winget:
    name: winget
    needs: [build, publish]
    if: needs.build.outputs.prerelease == 'false' && vars.WINGET_IDENTIFIER != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: winget
    permissions: {}
    env:
      KOMAC_VERSION: 2.16.0
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Install Komac
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/komac.tar.gz" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/komac.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac

      - name: Submit
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          IDENTIFIER: ${{ vars.WINGET_IDENTIFIER }}
        run: |
          base="https://github.com/localport/agent/releases"
          "$RUNNER_TEMP/komac" update "$IDENTIFIER" \
            --version "${TAG#v}" \
            --urls "$base/download/$TAG/localport-windows-amd64.exe" \
            --release-notes-url "$base/tag/$TAG" \
            --submit
