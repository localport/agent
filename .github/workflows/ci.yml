name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        go: [stable]
        include:
          # Minimum version from go.mod, as stated in the README.
          - os: ubuntu-26.04
            go: "1.27"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Test the matrix Go version, not the toolchain named in go.mod.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tools/errwrapcheck/go.sum
      - run: make test
      - run: make smoke

  # internal/security has windows-only code paths (owner SID, reparse points,
  # DACL, lock file) that the other runners never build.
  test-windows:
    name: Test (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...

  # The NSIS installer built unsigned exactly as the release builds it, then
  # installed, upgraded and uninstalled on the elevated runner.
  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      VERSION: v0.0.0-ci
      NSIS_VERSION: "3.13"
      # SHA-256 of the official download, as in release.yml.
      NSIS_ZIP_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: |
          scripts/release/winres.sh "$VERSION"
          mkdir stage
          for c in localport localport-session; do
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "stage/$c.exe" "./cmd/$c"
          done
          cp LICENSE NOTICE THIRD_PARTY_NOTICES stage/
      - name: Install NSIS
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/nsis.zip" \
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/$NSIS_VERSION/nsis-$NSIS_VERSION.zip"
          echo "$NSIS_ZIP_SHA256  $RUNNER_TEMP/nsis.zip" | sha256sum --check --strict -
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath \"$RUNNER_TEMP/nsis.zip\" -DestinationPath \"$RUNNER_TEMP/nsis\""
          echo "MAKENSIS=$RUNNER_TEMP/nsis/nsis-$NSIS_VERSION/makensis.exe" >>"$GITHUB_ENV"
      - name: Package
        run: |
          scripts/release/windows-package.sh uninstaller stage
          SOURCE_DATE_EPOCH=0 scripts/release/windows-package.sh installer stage out
      - name: Install, upgrade, uninstall
        shell: pwsh
        run: scripts/ci/test-windows-installer.ps1 -Installer "out/localport-setup-0.0.0-ci-windows-amd64.exe" -Version "0.0.0-ci"

  # The installer script compiles with NSIS built from source and the Scoop
  # and winget manifests validate against their pinned schemas.
  packaging:
    name: Packaging check
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check-packaging

  vet:
    name: Vet (all platforms)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make vet-all

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: make errwrapcheck

  # The TestRoot tests, as root with libpam and the localport PAM service.
  test-root:
    name: Test as root (PAM)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: libpam and the PAM service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends libpam0g-dev >/dev/null
          sudo install -m 0644 packaging/pam/localport.debian /etc/pam.d/localport
          sudo useradd --create-home --shell /bin/sh lptest
      - run: sudo env "PATH=$PATH" GOTOOLCHAIN=local LOCALPORT_TEST_LOGIN=lptest LOCALPORT_REQUIRE_ROOT_TESTS=1 make test-root

  # The TestRoot tests on macOS, as root with OpenDirectory PAM and the
  # localport PAM service. The runner has passwordless sudo.
  test-root-macos:
    name: Test as root (PAM, macOS)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: The test account and the PAM service
        run: |
          sudo sysadminctl -addUser lptest -shell /bin/sh -password "$(openssl rand -base64 24)"
          sudo install -m 0644 packaging/pam/localport.darwin /etc/pam.d/localport
      - run: sudo env "PATH=$PATH" GOTOOLCHAIN=local LOCALPORT_TEST_LOGIN=lptest LOCALPORT_REQUIRE_ROOT_TESTS=1 make test-root

  # The helper's password logon (LogonUser) for a real local account, created
  # with a generated password. The full helper needs SYSTEM, which a runner
  # step does not have.
  test-windows-logon:
    name: Password logon (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: The test account
        # Windows PowerShell 5.1: Microsoft.PowerShell.LocalAccounts is native there.
        shell: powershell
        run: |
          $bytes = New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $pw = [Convert]::ToBase64String($bytes) + 'aA1!'
          Write-Output "::add-mask::$pw"
          New-LocalUser -Name lptest -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          "LOCALPORT_TEST_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: go test -count=1 -v -run '^TestRootPasswordLogon$' ./internal/sessionhelper/
        env:
          GOTOOLCHAIN: local
          LOCALPORT_TEST_LOGIN: lptest
          LOCALPORT_REQUIRE_ROOT_TESTS: "1"

  # Compiles the SELinux CIL module against the targeted policy.
  selinux:
    name: SELinux module
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dnf -y -q install selinux-policy-targeted policycoreutils setools-console
      - run: semodule -n -s targeted -X 200 -i packaging/selinux/localport.cil
      - run: semodule -n -s targeted -l | grep -qx localport
      # The built policy (not loaded: the container has no SELinux) holds the
      # labels root's runtime-created files get and the agent's lock access,
      # and the agent cannot write its root-owned config.
      - name: Policy rules
        shell: bash
        run: |
          set -euo pipefail
          policies=(/etc/selinux/targeted/policy/policy.*)
          [ "${#policies[@]}" -eq 1 ] || { echo "expected one policy file: ${policies[*]}"; exit 1; }
          policy="${policies[0]}"
          expect() { sesearch "$@" "$policy" | grep -qxF "$want" || { echo "missing: $want"; exit 1; }; }
          for c in unconfined_t sysadm_t; do
            want="type_transition $c etc_t:dir localport_etc_t localport-device;" expect -T -s "$c" -t etc_t -c dir
            want="type_transition $c localport_etc_t:dir localport_state_t identity;" expect -T -s "$c" -t localport_etc_t -c dir
            want="type_transition $c localport_etc_t:file localport_lock_t run.lock;" expect -T -s "$c" -t localport_etc_t -c file
          done
          want="allow localport_t localport_lock_t:file { getattr lock open read write };" expect -A -s localport_t -t localport_lock_t -c file
          denied="$(sesearch -A -s localport_t -t localport_etc_t -c file -p write,append,lock,setattr,create,unlink,rename "$policy")"
          if [ -n "$denied" ]; then echo "localport_t can modify localport_etc_t files:"; echo "$denied"; exit 1; fi

  # systemd's exposure score of the generated device unit (the golden file
  # TestSystemdAgentUnitMatchesGolden pins) and of the documented example
  # unit. Each threshold is the unit's score, 0 to 100, measured with
  # systemd 259, so a weaker unit fails.
  unit-hardening:
    name: systemd unit hardening
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: systemd-analyze security --offline=true --threshold=13 internal/service/testdata/localport-device.service
      - run: systemd-analyze security --offline=true --threshold=12 deploy/localport.service

  # RustSec advisories for the Rust golden generators of the RDP tests.
  cargo-deny:
    name: Rust advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP" "$name/cargo-deny"
          echo "$RUNNER_TEMP/$name" >>"$GITHUB_PATH"
      - run: make cargo-deny

  # Every cgo localport-session build of the release (glibc, musl, ARMv6,
  # signed darwin), with the floor and architecture checks they run.
  sessions:
    uses: ./.github/workflows/session.yml

  # Release dry run with throwaway keys: packages, signed repositories and
  # install tests, from the session and signed darwin binaries `make dist`
  # requires.
  dryrun:
    name: Release dry run
    needs: sessions
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{session-*,darwin}"
          path: bin
          merge-multiple: true
      # Artifacts do not keep file modes.
      - run: chmod 0755 bin/localport-*
      - run: make release-dryrun

  notices:
    name: Third-party notices
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: make notices-check
