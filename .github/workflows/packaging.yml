name: Packaging

# An OpenWrt package build and ShellCheck. Every check here is required on
# main. The OpenWrt build runs on a pull request only when it changes release
# files, and a skipped job counts as passed. The release dry run is in ci.yml,
# beside the session builds it consumes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect release changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "release=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          # The files API lists at most 3000 files, so a larger change runs.
          if [ "$(wc -l <<<"$files")" -ge 3000 ] ||
            grep -qE '^(\.github/workflows/(packaging|release)\.yml|Makefile|go\.mod|packaging/.+|scripts/release/.+)$' <<<"$files"; then
            echo "release=true" >>"$GITHUB_OUTPUT"
          else
            echo "release=false" >>"$GITHUB_OUTPUT"
          fi

  # One arch of the release OpenWrt build, so a broken SDK pin, feed or
  # package Makefile fails here instead of at a tag.
  openwrt:
    name: OpenWrt build (x86_64)
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packaging/openwrt/sdk.sh build x86_64 0.0.0 out

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck -x
