name: Session builder

# Builds each stage of packaging/session/builder.Dockerfile and pushes it to
# ghcr.io/localport/session-builder:<stage> with an SBOM and build provenance.
# Each image is signed keyless with Sigstore; the signing identity is this
# workflow on refs/heads/main. The job summary lists each image digest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/session/builder.Dockerfile
      - .github/workflows/session-builder.yml

permissions: {}

concurrency:
  group: session-builder
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/localport/session-builder

jobs:
  image:
    name: session-builder (${{ matrix.stage }})
    # A dispatch from another branch is skipped, so every signature names main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # Sigstore signing and build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: glibc-el8
            platforms: linux/amd64,linux/arm64
          - stage: musl
            platforms: linux/amd64,linux/arm64,linux/arm/v6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=docker.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/session
          file: packaging/session/builder.Dockerfile
          target: ${{ matrix.stage }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.stage }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign image (Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Digest
        env:
          STAGE: ${{ matrix.stage }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "\`$IMAGE:$STAGE@$DIGEST\`" >>"$GITHUB_STEP_SUMMARY"
