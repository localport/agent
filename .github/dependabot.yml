version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /tools/errwrapcheck
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories:
      - /packaging
      - /packaging/session
      - /packaging/windows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The golden generators of the RDP tests.
  - package-ecosystem: cargo
    directories:
      - /internal/session/testdata/rdpfilter
      - /internal/session/testdata/rdcleanpath
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
