version: 1

# Several tunnels and a fleet from one agent process.

tunnels:
  - name: api
    token: ${env.TUNNEL_TOKEN}
    upstream: http://localhost:8080

  - name: db
    token: ${env.TUNNEL_TOKEN}
    upstream: tcp://localhost:5432

  - name: search
    token: ${env.TUNNEL_TOKEN}
    upstream: tls://192.168.1.34:9200

# A fleet groups devices under one token. Their ports are set in the dashboard.
# `host` is the address this machine forwards a device's traffic to.
fleets:
  - token: ${env.FLEET_TOKEN}
    devices:
      # This machine.
      - name: hub

      # Another machine on the local network.
      - name: plc-01
        host: 192.168.1.100

      - name: plc-02
        host: 192.168.1.101
